- insert:
    - id: task-agent-kit
      name: '@local/dsh-task-agent-kit'
      config:
        sourceAgentPath: ''
        basePresetId: ''
        skillDirCandidates: ['.skills', '.agents/skills', 'skills']

# Agent Teams, carried by THIS installed bundle.
#
# `@deepseek-ai/dsh-experimental-agent-team-profile` is an optional shipped bundle: the
# profile maintenance pass drops it from the manifest again on the next launch (observed
# twice), which silently reverts the whole deployment to the legacy subagent controls —
# `spawn_teammate` disappears, `team_task_*` disappears, and `maxDepth` pins the tree at
# one level. This bundle IS installed and survives restarts, so its layer carries the same
# replacements, which is the documented way to enable a shipped plugin durably.
#
# Do NOT also enable the team profile bundle: the two layers would insert the same row ids.
- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

